name: Deploy Docs
on:
  pull_request:
    paths:
      - docs/**
      - examples/docs_snippets/**
      - examples/docs_projects/**
      - examples/airlift-migration-tutorial/**
      - .github/workflows/build-docs.yml
      - "!docs/README.md"
      - "!docs/CONTRIBUTING.md"
      - "!docs/content-templates/**"
      # Required for `yarn rebuild-kinds-tags`
      - js_modules/ui-core/src/graph/OpTags.tsx
      # Required to rebuild docs on new version release
      - python_modules/dagster/dagster/version.py
      - CHANGES.md
    types:
      - opened
      - reopened
      - synchronize
      - ready_for_review

concurrency:
  group: ${{ github.workflow}}-${{github.ref}}
  cancel-in-progress: true

# This fork validates docs without publishing upstream previews.
permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Install node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 18

      - name: Lint Docs
        run: |
          cd docs
          yarn install
          yarn run lint
