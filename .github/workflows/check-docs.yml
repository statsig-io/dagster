name: Check Docs

on:
  pull_request:
    paths:
      - 'docs/**'

permissions:
  contents: read

jobs:
  check-frontmatter:
    runs-on: blacksmith-2vcpu-ubuntu-2404
    steps:
    - uses: actions/checkout@v4

    - name: Install uv
      uses: astral-sh/setup-uv@v5

    - name: Run frontmatter check
      working-directory: docs
      run: uv run scripts/check-frontmatter.py
